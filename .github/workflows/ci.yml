# CI: verifica que la demo siga funcionando en cada
# cambio. NO despliega nada (no hay tokens ni
# secretos de hosting aquí: el despliegue lo hacen
# las integraciones dashboard↔GitHub del usuario).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        # mongo:8 incluye mongosh (imagen oficial).
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # El wrapper puede llegar sin permiso de ejecución
      # desde Windows.
      - run: chmod +x ./backend/mvnw
      - run: ./backend/mvnw --batch-mode test
        env:
          # BackendApplicationTests (@SpringBootTest,
          # perfil dev por defecto) usa esta base propia
          # controlada; los tests con
          # @ActiveProfiles("test") leen
          # application-test.properties
          # (bunuelos_yanelys_test). Ningún test toca
          # una base "real".
          SPRING_MONGODB_URI: mongodb://localhost:27017/bunuelos_yanelys_ci
      - name: Verify Docker image used by Render
        run: docker build --tag bunuelos-backend:ci ./backend
