<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a5631a" />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeos.
      try {
        var p = JSON.parse(localStorage.getItem('by-preferences') || '{}');
        var dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.motion = p.motion || 'normal';
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Buñuelos Yanelys — gestión de pedidos y entregas."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Buñuelos Yanelys · Gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
