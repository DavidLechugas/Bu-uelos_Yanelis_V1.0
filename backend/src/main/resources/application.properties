spring.application.name=buñuelos-yanelys-backend

# Demo local: escucha solo en loopback, nunca expuesta a la red.
server.address=127.0.0.1
server.port=8080

# MongoDB local. Sobrescribible con la variable de entorno SPRING_MONGODB_URI
# (Spring Boot 4 usa el prefijo spring.mongodb.*).
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://127.0.0.1:27017/bunuelos_yanelys}

# Perfil activo por defecto: dev (activa la semilla de demostración insert-only).
# El perfil prod NO inserta semilla alguna.
spring.profiles.active=dev

# Sesión: en http://localhost la cookie no puede ser Secure.
# El perfil prod la fuerza a Secure.
app.auth.cookie-secure=false
