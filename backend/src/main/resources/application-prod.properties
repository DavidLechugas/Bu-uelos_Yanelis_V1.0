# Perfil de despliegue de la demostración (Render +
# Cloudflare Pages). Activar ÚNICAMENTE con la variable de
# entorno SPRING_PROFILES_ACTIVE=prod.
#
# Nada secreto vive en este archivo: todo viene del entorno.

# MongoDB OBLIGATORIA por variable de entorno (fail closed):
# sin SPRING_MONGODB_URI la aplicación NO arranca.
spring.mongodb.uri=${SPRING_MONGODB_URI}

# Render inyecta PORT en el contenedor (por defecto 8080).
server.port=${PORT:8080}

# En hosting el contenedor debe escuchar en todas las
# interfaces. En dev sigue siendo 127.0.0.1
# (ver application.properties: los defaults no cambian).
server.address=0.0.0.0

# CORS: el origen EXACTO del frontend se configura con la
# variable de entorno FRONTEND_ORIGIN (lo lee ApiCorsConfig).
# Sin ella, ningún origen cruzado está permitido (fail closed).

# Cookies de sesión y CSRF solo por HTTPS.
app.auth.cookie-secure=true
